<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fafaf7" id="themeColor">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Reflow Reader</title>
<style>
[hidden]{display:none!important}
.card>button{display:block;margin:10px auto;max-width:100%}
.numin{flex:1;min-width:0;height:42px;border:1px solid var(--line);border-radius:12px;background:transparent;color:inherit;padding:0 12px;font:inherit}
.pgbtn2{flex:0 0 56px;width:56px;height:42px;padding:0;font-size:1rem;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#pageinfo{cursor:pointer;padding:6px 0;text-decoration:underline dotted;min-width:84px}
#pct{cursor:pointer}
.ibtn{display:inline-flex;align-items:center;justify-content:center;padding:0;flex:0 0 auto}
.ibtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#bmBtn{height:34px;width:34px;min-width:34px;border-radius:10px}
#bmBtn svg{width:18px;height:18px}
#bmBtn.on svg{fill:var(--accent);stroke:var(--accent)}
.tabs{display:flex;gap:8px;margin:0 0 12px}
.tabs button{flex:1;height:40px;padding:0 6px;font-size:.85rem}
.tabs button.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.sheet.tall{height:72vh;display:flex;flex-direction:column;overflow:hidden}
.pbody{overflow:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.item{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:10px 2px;cursor:pointer}
.item .grow{flex:1;min-width:0}
.item .t{font-size:.95rem;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item .m{font-size:.75rem;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.item.cur .t{color:var(--accent);font-weight:600}
.item .x{height:34px;width:34px;min-width:34px;padding:0;border-radius:10px;flex:0 0 auto}
.empty{color:var(--muted);font-size:.9rem;padding:14px 2px;line-height:1.5}
.lib{text-align:left;max-height:34vh;overflow:auto;margin-top:6px}
.addrow{margin:0 0 8px}
.addrow button{width:100%}
.pgrow{display:flex;gap:8px;align-items:stretch}
.pgbtn{flex:1;min-width:0;height:54px;padding:0;font-size:1rem;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#pgNow{flex:1.7;display:flex;align-items:center;justify-content:center;font-size:1.05rem;font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:12px;cursor:pointer;white-space:nowrap}
#pgRange{width:100%;margin:14px 0 4px;accent-color:var(--accent)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#fafaf7;--fg:#1d1d1b;--muted:#77756f;--bar:rgba(250,250,247,.95);--accent:#2f6fed;--line:#e2e0d8;--on-accent:#fff;
--fs:19px;--lh:1.65;--side:6vw;--mt:24px;--mb:16px;--ff:Georgia,'Noto Serif',serif;--align:left}
[data-theme=sepia]{--bg:#f3e8d2;--fg:#3b2f20;--muted:#8a7658;--bar:rgba(243,232,210,.95);--accent:#a4571d;--line:#dccfb4}
[data-theme=dark]{--bg:#1c1d20;--fg:#d6d6d2;--muted:#8b8b88;--bar:rgba(28,29,32,.96);--accent:#6ea0ff;--line:#33353a;--on-accent:#0b0b0c}
[data-theme=black]{--bg:#000;--fg:#bdbdb8;--muted:#6d6d6a;--bar:rgba(0,0,0,.96);--accent:#6ea0ff;--line:#222;--on-accent:#000}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
font-family:system-ui,Roboto,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:12px;
padding:0 14px;height:46px;min-width:46px;cursor:pointer}
button:active{opacity:.6}
button.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
#reader{position:fixed;left:0;right:0;top:calc(var(--mt) + env(safe-area-inset-top));bottom:calc(var(--mb) + env(safe-area-inset-bottom));
overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#text{position:relative;margin:0 auto;max-width:42em;
padding:56px var(--side) calc(100vh - 40px);
font-family:var(--ff);font-size:var(--fs);line-height:var(--lh);text-align:var(--align);hyphens:auto;-webkit-hyphens:auto}
#text p{margin:0 0 .9em}
#text h2{font-size:1.22em;line-height:1.3;margin:1.7em 0 .6em;font-weight:700;text-align:left}
#progressline{position:fixed;top:0;left:0;right:0;height:3px;z-index:40;background:var(--line)}
#progressline i{display:block;height:100%;width:0;background:var(--accent)}
#pct{position:fixed;z-index:35;top:calc(8px + env(safe-area-inset-top));right:10px;font-size:.78rem;font-variant-numeric:tabular-nums;
padding:3px 9px;border-radius:999px;background:var(--bar);color:var(--fg);border:1px solid var(--line)}
#top{position:fixed;z-index:30;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;
padding:calc(8px + env(safe-area-inset-top)) 112px 8px 14px;
background:var(--bar);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);transition:transform .25s}
#title{display:block;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.9rem;color:var(--muted)}
#bottom{position:fixed;z-index:30;left:0;right:0;bottom:0;padding:10px 14px calc(12px + env(safe-area-inset-bottom));
background:var(--bar);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);transition:transform .25s}
body.hide #top{transform:translateY(-110%)}
body.hide #bottom{transform:translateY(110%)}
body.nodoc #top,body.nodoc #bottom,body.nodoc #pct,body.nodoc #progressline{display:none}
#info{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:2px}
#seek{width:100%;margin:6px 0 10px;accent-color:var(--accent)}
#controls{display:flex;gap:8px;justify-content:space-between}
#controls .primary{flex:1;max-width:140px;font-size:1.1rem}
#controls button:not(.primary){flex:0 0 46px;width:46px;padding:0}
#welcome{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
#welcome.gone{display:none}
.card{width:100%;max-width:420px;text-align:center}
.card h1{margin:0 0 8px;font-size:1.6rem}
.card p{color:var(--muted);line-height:1.5}
.card .big{height:54px;padding:0 28px;font-size:1.05rem;margin:10px 0}
#werr{color:#d9534f!important}
#welcome.drag .card{outline:2px dashed var(--accent);outline-offset:18px}
#loading{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:var(--bg);flex-direction:column;gap:14px}
#loading.on{display:flex}
#lbar{width:min(300px,70vw);height:8px;border-radius:8px;background:var(--line);overflow:hidden}
#lbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
#ltext{color:var(--muted);font-size:.9rem}
#backdrop{position:fixed;inset:0;z-index:44;background:rgba(0,0,0,.35);display:none}
#backdrop.on{display:block}
.sheet{position:fixed;z-index:45;left:0;right:0;bottom:0;max-height:80vh;overflow:auto;background:var(--bg);border-top:1px solid var(--line);
border-radius:18px 18px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s}
.sheet.on{transform:none}
.row{margin:0 0 16px}
.row label{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-bottom:6px}
.row input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:flex;gap:8px}
.seg button{flex:1;height:42px;padding:0 6px;font-size:.85rem}
.seg button.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.sw-light{background:#fafaf7;color:#1d1d1b}.sw-sepia{background:#f3e8d2;color:#3b2f20}
.sw-dark{background:#1c1d20;color:#d6d6d2}.sw-black{background:#000;color:#bdbdb8}
#toast{position:fixed;z-index:70;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translateX(-50%);
background:#222;color:#fff;padding:8px 14px;border-radius:999px;font-size:.82rem;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.on{opacity:.95}
</style>
</head>
<body class="nodoc">

<div id="reader"><article id="text"></article></div>

<div id="progressline"><i></i></div>
<div id="pct">0.0%</div>
<header id="top"><span id="title"></span>
  <button id="bmBtn" class="ibtn" aria-label="Toggle bookmark"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button></header>

<footer id="bottom">
  <div id="info"><span id="pageinfo"></span><span id="wpmlabel"></span><span id="left"></span></div>
  <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
  <div id="controls">
    <button id="menuBtn" class="ibtn" aria-label="Contents, bookmarks, library"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <button id="slower" aria-label="Slower">−</button>
    <button id="play" class="primary" aria-label="Play / pause">▶</button>
    <button id="faster" aria-label="Faster">+</button>
    <button id="settingsBtn" aria-label="Settings">Aa</button>
  </div>
</footer>

<div id="backdrop"></div>
<div id="sheet" class="sheet">
  <div class="row"><label><span>Text size</span><span id="v-size"></span></label><input type="range" id="r-size" min="13" max="36" step="1"></div>
  <div class="row"><label><span>Line spacing</span><span id="v-lh"></span></label><input type="range" id="r-lh" min="1.2" max="2.3" step="0.05"></div>
  <div class="row"><label><span>Side margins</span><span id="v-m"></span></label><input type="range" id="r-m" min="1" max="20" step="1"></div>
  <div class="row"><label><span>Top margin</span><span id="v-mt"></span></label><input type="range" id="r-mt" min="0" max="160" step="2"></div>
  <div class="row"><label><span>Bottom margin</span><span id="v-mb"></span></label><input type="range" id="r-mb" min="0" max="160" step="2"></div>
  <div class="row"><label><span>Top indicator (tap it to swap)</span></label>
    <div class="seg" id="seg-top"><button data-val="pct">Percentage</button><button data-val="page">Page number</button></div></div>
  <div class="row"><label><span>Page count (clear the box for the PDF's own pages)</span><span id="v-pages"></span></label>
    <div class="seg"><input type="number" class="numin" id="pagesInput" inputmode="numeric" min="1" max="5000" placeholder="e.g. 50"><button class="pgbtn2" id="pgDown" aria-label="Fewer pages">▼</button><button class="pgbtn2" id="pgUp" aria-label="More pages">▲</button></div></div>
  <div class="row"><label><span>Font</span></label>
    <div class="seg" id="seg-font"><button data-val="serif">Serif</button><button data-val="sans">Sans</button><button data-val="mono">Mono</button></div></div>
  <div class="row"><label><span>Alignment</span></label>
    <div class="seg" id="seg-align"><button data-val="left">Left</button><button data-val="justify">Justified</button></div></div>
  <div class="row"><label><span>Theme</span></label>
    <div class="seg" id="seg-theme">
      <button data-val="light" class="sw-light">Light</button><button data-val="sepia" class="sw-sepia">Sepia</button>
      <button data-val="dark" class="sw-dark">Dark</button><button data-val="black" class="sw-black">Black</button></div></div>
  <div class="row"><button id="sheetOpen" style="width:100%">Open another PDF</button></div>
</div>

<div id="menu" class="sheet tall">
  <div class="tabs" id="tabs"><button data-tab="contents">Contents</button><button data-tab="marks">Bookmarks</button><button data-tab="library">Library</button></div>
  <div class="pbody" id="pb-contents"></div>
  <div class="pbody" id="pb-marks" hidden></div>
  <div class="pbody" id="pb-library" hidden>
    <div class="addrow"><button id="addPdf">+ Add a PDF</button></div>
    <div id="menuLib"></div>
    <div class="empty" id="storeInfo"></div>
  </div>
</div>

<div id="pager" class="sheet">
  <div class="pgrow">
    <button class="pgbtn" data-d="-10" aria-label="Back 10 pages">▼▼</button>
    <button class="pgbtn" data-d="-1" aria-label="Previous page">▼</button>
    <div id="pgNow">1 / 1</div>
    <button class="pgbtn" data-d="1" aria-label="Next page">▲</button>
    <button class="pgbtn" data-d="10" aria-label="Forward 10 pages">▲▲</button>
  </div>
  <input type="range" id="pgRange" min="1" max="1" step="1" value="1" aria-label="Page">
</div>

<div id="welcome">
  <div class="card">
    <h1>Reflow Reader</h1>
    <p>Open a PDF to read it as reflowable text, with auto-scroll and a live progress percentage.</p>
    <button class="primary big" id="welcomeOpen">Open a PDF</button>
    <div class="lib" id="welcomeLib"></div>
    <button id="installBtn" hidden>Install app</button>
    <p>Tip: once installed, share a PDF to this app from your file manager.</p>
    <p id="werr"></p>
  </div>
</div>

<div id="loading"><div id="lbar"><i></i></div><div id="ltext">Loading…</div></div>
<div id="toast"></div>
<input type="file" id="file" accept="application/pdf,.pdf" hidden>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const reader=$('#reader'), text=$('#text');

/* ---------- storage ---------- */
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* ---------- settings ---------- */
const S=Object.assign({size:19,lh:1.65,m:6,mt:24,mb:16,top:'pct',font:'serif',align:'left',theme:'light',wpm:220},lsGet('pdfr:settings',{}));
const FONTS={serif:"Georgia,'Noto Serif',serif",sans:"system-ui,Roboto,'Helvetica Neue',sans-serif",mono:"ui-monospace,Menlo,Consolas,monospace"};
const THEME_COLORS={light:'#fafaf7',sepia:'#f3e8d2',dark:'#1c1d20',black:'#000000'};
function applySettings(){
  const r=document.documentElement;
  r.style.setProperty('--fs',S.size+'px');
  r.style.setProperty('--lh',S.lh);
  r.style.setProperty('--side',S.m+'vw');
  r.style.setProperty('--ff',FONTS[S.font]||FONTS.serif);
  r.style.setProperty('--align',S.align);
  r.dataset.theme=S.theme;
  $('#themeColor').content=THEME_COLORS[S.theme]||'#fafaf7';
  $('#r-size').value=S.size;$('#v-size').textContent=S.size+' px';
  $('#r-lh').value=S.lh;$('#v-lh').textContent=(+S.lh).toFixed(2);
  $('#r-m').value=S.m;$('#v-m').textContent=S.m;
  r.style.setProperty('--mt',S.mt+'px');r.style.setProperty('--mb',S.mb+'px');
  $('#r-mt').value=S.mt;$('#v-mt').textContent=S.mt+' px';
  $('#r-mb').value=S.mb;$('#v-mb').textContent=S.mb+' px';
  for(const [id,key] of [['seg-font','font'],['seg-align','align'],['seg-theme','theme'],['seg-top','top']])
    document.querySelectorAll('#'+id+' button').forEach(b=>b.classList.toggle('sel',b.dataset.val===S[key]));
  $('#wpmlabel').textContent=S.wpm+' wpm';
}
function saveSettings(){lsSet('pdfr:settings',S)}

/* ---------- pdf.js loading ---------- */
const PDFJS_VER='3.11.174';
const BASE='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/'+PDFJS_VER+'/';
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;
  s.onerror=()=>rej(new Error('Could not load pdf.js. Check your internet connection.'));document.head.appendChild(s)})}
let pdfReady=null;
function initPdf(){
  if(!pdfReady)pdfReady=(async()=>{
    await loadScript(BASE+'pdf.min.js');
    try{const r=await fetch(BASE+'pdf.worker.min.js');const b=await r.blob();
      pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(b)}
    catch(e){pdfjsLib.GlobalWorkerOptions.workerSrc=BASE+'pdf.worker.min.js'}
  })();
  pdfReady.catch(()=>{pdfReady=null});
  return pdfReady;
}
initPdf().catch(()=>{});

/* ---------- text extraction ---------- */
async function extractPage(page,num){
  const vp=page.getViewport({scale:1});
  const H=vp.height;
  const tc=await page.getTextContent();
  const lines=[];let cur=null;
  for(const it of tc.items){
    if(typeof it.str!=='string')continue;
    const x=it.transform[4],y=it.transform[5];
    const h=Math.abs(it.transform[3])||it.height||10;
    if(!it.str.trim()){if(cur&&it.str)cur.pendingSpace=true;continue}
    const w=it.width||0;
    if(!cur||Math.abs(y-cur.y)>Math.max(2,cur.h*0.5)||(x-cur.xEnd)<-h*2){
      cur={text:it.str,x,y,h,xEnd:x+w,pendingSpace:false};lines.push(cur);
    }else{
      const gap=x-cur.xEnd;
      if((cur.pendingSpace||gap>h*0.18)&&!/\s$/.test(cur.text)&&!/^\s/.test(it.str))cur.text+=' ';
      cur.text+=it.str;cur.xEnd=Math.max(cur.xEnd,x+w);cur.h=Math.max(cur.h,h);cur.pendingSpace=false;
    }
  }
  const out=lines.map(l=>{l.text=l.text.replace(/\s+/g,' ').trim();l.edge=(l.y>H*0.93||l.y<H*0.07);return l}).filter(l=>l.text);
  return {num,lines:out};
}

const TERM=/[.!?…:"”’»)\]]$/;
function joinText(a,b){
  if(/\p{L}-$/u.test(a)&&/^\p{Ll}/u.test(b))return a.slice(0,-1)+b;
  return a+' '+b;
}

function buildDoc(pages){
  // drop repeating headers/footers and page numbers
  const norm=t=>t.replace(/\d+/g,'#').replace(/\s+/g,' ').trim().toLowerCase();
  const counts=new Map();
  for(const p of pages){
    const seen=new Set();
    for(const l of p.lines)if(l.edge){const k=norm(l.text);if(!seen.has(k)){seen.add(k);counts.set(k,(counts.get(k)||0)+1)}}
  }
  const thr=Math.max(3,pages.length*0.25);
  for(const p of pages){
    p.lines=p.lines.filter(l=>{
      if(!l.edge)return true;
      const t=l.text.trim();
      if(/^[-–—\s]*(page\s*)?(\d{1,4}|[ivxlc]{1,6})[-–—\s]*$/i.test(t))return false;
      if(pages.length>=4&&counts.get(norm(t))>=thr)return false;
      return true;
    });
  }
  // typical body size
  const hs=[];for(const p of pages)for(const l of p.lines)hs.push(l.h);
  hs.sort((a,b)=>a-b);
  const bodyH=hs.length?hs[hs.length>>1]:10;
  const isHeadH=h=>h>bodyH*1.18;

  const paras=[];
  let prevPageLast=null;
  for(const p of pages){
    const L=p.lines;if(!L.length)continue;
    const gaps=[];for(let i=1;i<L.length;i++){const g=L[i-1].y-L[i].y;if(g>0.5)gaps.push(g)}
    gaps.sort((a,b)=>a-b);
    const med=gaps.length?gaps[gaps.length>>1]:bodyH*1.2;
    const minX=Math.min(...L.map(l=>l.x)),maxX=Math.max(...L.map(l=>l.xEnd)),width=Math.max(1,maxX-minX);
    const pageParas=[];let c=null;
    L.forEach((l,i)=>{
      let br=!c;
      if(c){
        const pv=L[i-1],gap=pv.y-l.y,ih=isHeadH(l.h),wh=isHeadH(pv.h);
        const pt=pv.text;
        if(gap<-bodyH||gap>med*1.45)br=true;
        else if(ih!==wh)br=true;
        else if(!ih&&TERM.test(pt)&&pv.xEnd<minX+width*0.72)br=true;
        else if(!ih&&l.x>minX+bodyH*0.9&&TERM.test(pt))br=true;
      }
      if(br){c={text:l.text,h:l.h,page:p.num};pageParas.push(c)}
      else{c.text=joinText(c.text,l.text);c.h=Math.max(c.h,l.h)}
    });
    for(const q of pageParas)q.head=isHeadH(q.h)&&q.text.length<160;
    // merge paragraph continuing across a page break
    if(prevPageLast&&pageParas.length){
      const f=pageParas[0];
      if(!prevPageLast.head&&!f.head&&!TERM.test(prevPageLast.text)&&/^\p{Ll}/u.test(f.text)){
        prevPageLast.text=joinText(prevPageLast.text,f.text);pageParas.shift();
      }
    }
    for(const q of pageParas)paras.push(q);
    if(paras.length)prevPageLast=paras[paras.length-1];
  }
  return paras;
}

/* ---------- state ---------- */
let doc={paras:[],numPages:0,title:''};
let tops=[],totalWords=0,spanH=1,docKey='',pagesKey='',customPages=0,cum=[],wc=[];
let bookId='',bookmarks=[],toc=[],pgDrag=false,menuTab='contents',endScroll=1;
let playing=false,pos=0,lastT=0,lastSet=0,touching=false,raf=0,dragging=false,wakeLock=null;

/* ---------- loading UI ---------- */
function showLoading(msg,f){$('#loading').classList.add('on');setLoading(f,msg)}
function setLoading(f,msg){$('#lbar i').style.width=Math.round(f*100)+'%';if(msg)$('#ltext').textContent=msg}
function hideLoading(){$('#loading').classList.remove('on')}
let toastTimer;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('on'),2200)}
const tick=()=>new Promise(r=>setTimeout(r,0));

/* ---------- open file ---------- */
async function openFile(file,opts){
  if(!file)return;
  stop();
  closePanels();
  $('#werr').textContent='';
  showLoading('Loading PDF…',0);
  try{
    await initPdf();
    const buf=await file.arrayBuffer();
    const task=pdfjsLib.getDocument({data:buf});
    task.onPassword=(update,reason)=>{
      const p=prompt(reason===2?'Wrong password. Try again:':'This PDF is password protected. Password:');
      if(p===null){task.destroy();return}
      update(p);
    };
    const pdf=await task.promise;
    const pages=[];
    for(let i=1;i<=pdf.numPages;i++){
      const page=await pdf.getPage(i);
      pages.push(await extractPage(page,i));
      page.cleanup();
      if(i%2===0||i===pdf.numPages){setLoading(i/pdf.numPages,'Extracting text… '+i+' / '+pdf.numPages);await tick()}
    }
    let title=file.name.replace(/\.pdf$/i,''),lang='en';
    try{const m=await pdf.getMetadata();if(m&&m.info){if(m.info.Title&&m.info.Title.trim())title=m.info.Title.trim();if(m.info.Language)lang=m.info.Language}}catch(e){}
    const paras=buildDoc(pages);
    const words=paras.reduce((n,p)=>n+p.text.split(/\s+/).length,0);
    if(words<20){
      hideLoading();
      throw new Error('No selectable text found. This PDF looks scanned (images only), so it can\'t be reflowed. Run OCR on it first.');
    }
    let outline=[];
    try{outline=await loadOutline(pdf)}catch(e){}
    doc={paras,numPages:pdf.numPages,title};
    bookId=file.name+'|'+file.size;
    docKey='pdfr:pos:'+bookId;
    bookmarks=lsGet('pdfr:bm:'+bookId,[]);
    toc=buildToc(outline);
    pagesKey='pdfr:pages:'+file.name+'|'+file.size;
    customPages=lsGet(pagesKey,0);
    text.lang=lang;
    render();
    $('#title').textContent=title;
    syncPagesUI();
    document.title=title+' · Reflow Reader';
    $('#welcome').classList.add('gone');
    document.body.classList.remove('nodoc','hide');
    hideLoading();
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    measure();
    const f=lsGet(docKey,0);
    if(f>0.002){
      const max=maxScroll();
      reader.scrollTop=f*max;pos=reader.scrollTop;
      toast('Resumed at '+(f*100).toFixed(1)+'%');
    }else{reader.scrollTop=0;pos=0}
    updateUI();
    libRegister(file,title,pdf.numPages,!(opts&&opts.skipSave));
  }catch(err){
    hideLoading();
    const msg=err&&err.message?err.message:String(err);
    if($('#welcome').classList.contains('gone'))toast(msg);else $('#werr').textContent=msg;
    if(!$('#welcome').classList.contains('gone')||doc.paras.length===0)$('#werr').textContent=msg;
    else alert(msg);
  }
}

function render(){
  const frag=document.createDocumentFragment();
  totalWords=0;cum=[];wc=[];
  for(const p of doc.paras){
    const el=document.createElement(p.head?'h2':'p');
    el.textContent=p.text;frag.appendChild(el);
    const n=p.text.split(/\s+/).length;
    cum.push(totalWords);wc.push(n);totalWords+=n;
  }
  text.replaceChildren(frag);
}

function measure(){
  const ch=text.children;
  tops=new Array(ch.length);
  for(let i=0;i<ch.length;i++)tops[i]=ch[i].offsetTop;
  if(ch.length){const last=ch[ch.length-1];spanH=Math.max(1,last.offsetTop+last.offsetHeight-ch[0].offsetTop);endScroll=Math.max(1,last.offsetTop+last.offsetHeight-40)}
}
function maxScroll(){return Math.max(1,Math.min(reader.scrollHeight-reader.clientHeight,endScroll))}
function curIndex(){
  if(!tops.length)return 0;
  const y=reader.scrollTop+40;
  let lo=0,hi=tops.length-1;
  while(lo<hi){const mid=(lo+hi+1)>>1;if(tops[mid]<=y)lo=mid;else hi=mid-1}
  return lo;
}

/* ---------- page numbering (PDF pages or a custom page count) ---------- */
function pageCount(){return customPages>0?customPages:doc.numPages}
function wordPos(){
  const i=curIndex(),el=text.children[i];
  if(!el)return 0;
  const y=reader.scrollTop+40,h=Math.max(1,el.offsetHeight);
  const fr=Math.min(1,Math.max(0,(y-tops[i])/h));
  return cum[i]+fr*wc[i];
}
function pageNow(){
  if(!(customPages>0)){const p=doc.paras[curIndex()];return p?p.page:1}
  const N=customPages,max=maxScroll();
  if(max>0&&reader.scrollTop>=max-2)return N;
  return Math.min(N,Math.max(1,Math.floor(wordPos()/Math.max(1,totalWords)*N+1e-6)+1));
}
function paraAtWord(w){
  let lo=0,hi=cum.length-1;
  while(lo<hi){const mid=(lo+hi+1)>>1;if(cum[mid]<=w)lo=mid;else hi=mid-1}
  return lo;
}
function jumpToPara(i){
  reader.scrollTop=Math.max(0,(tops[i]||0)-40);pos=reader.scrollTop;lastSet=pos;updateUI();
}
function scrollToWord(w){
  const i=paraAtWord(w),el=text.children[i];
  if(!el)return;
  const top=tops[i]+((w-cum[i])/Math.max(1,wc[i]))*el.offsetHeight-40;
  reader.scrollTop=Math.max(0,top);pos=reader.scrollTop;lastSet=pos;updateUI();
}
function pageOfWord(w){
  if(customPages>0)return Math.min(customPages,Math.max(1,Math.floor(w/Math.max(1,totalWords)*customPages+1e-6)+1));
  const p=doc.paras[paraAtWord(w)];return p?p.page:1;
}
function gotoPage(n,dir){
  const N=pageCount();n=Math.max(1,Math.min(N,Math.round(n)));
  if(n===1){reader.scrollTop=0;pos=0;lastSet=0;updateUI();return}
  if(customPages>0){scrollToWord((n-1)/N*totalWords+0.02*totalWords/N);return}
  let i=doc.paras.findIndex(p=>p.page===n);
  if(i<0){
    if(dir<0){for(let k=doc.paras.length-1;k>=0;k--)if(doc.paras[k].page<n){i=k;break}}
    else i=doc.paras.findIndex(p=>p.page>n);
  }
  if(i<0)i=dir<0?0:doc.paras.length-1;
  jumpToPara(i);
}
function labelPages(){
  $('#v-pages').textContent=customPages>0?customPages+' (PDF has '+doc.numPages+')':'PDF pages ('+(doc.numPages||'–')+')';
}
function syncPagesUI(){
  const inp=$('#pagesInput');
  inp.value=customPages>0?customPages:'';
  inp.placeholder=doc.numPages?'PDF: '+doc.numPages:'e.g. 50';
  labelPages();
}
function setCustomPages(v){
  customPages=v>0?Math.min(5000,v):0;
  if(pagesKey)lsSet(pagesKey,customPages);
  labelPages();updateUI();
}
$('#pagesInput').addEventListener('input',e=>{const v=parseInt(e.target.value,10);setCustomPages(isNaN(v)?0:v)});
function nudgePages(d){
  const base=customPages>0?customPages:(doc.numPages||1);
  const v=Math.max(1,Math.min(5000,base+d));
  $('#pagesInput').value=v;setCustomPages(v);
}
function bindNudge(btn,d){
  let t1=0,t2=0,n=0;
  const halt=()=>{clearTimeout(t1);clearTimeout(t2);n=0};
  const loop=()=>{nudgePages(d*(n>20?10:1));n++;t2=setTimeout(loop,n>20?70:110)};
  btn.addEventListener('pointerdown',e=>{e.preventDefault();halt();nudgePages(d);t1=setTimeout(loop,420)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,halt));
  btn.addEventListener('contextmenu',e=>e.preventDefault());
}
bindNudge($('#pgDown'),-1);bindNudge($('#pgUp'),1);
$('#pageinfo').addEventListener('click',()=>{if(doc.paras.length)openPanel('#pager')});
labelPages();

/* ---------- progress UI ---------- */
function fmtTime(m){
  if(m<1)return '<1 min left';
  if(m<60)return Math.round(m)+' min left';
  const h=Math.floor(m/60),r=Math.round(m%60);
  return h+' h '+r+' min left';
}
let saveT=0;
function updateUI(){
  if(!doc.paras.length)return;
  const max=Math.max(1,maxScroll());
  const f=Math.min(1,Math.max(0,reader.scrollTop/max));
  const pctTxt=(f*100).toFixed(1)+'%',pgTxt='p. '+pageNow()+' / '+pageCount();
  $('#progressline i').style.width=(f*100)+'%';
  if(!dragging)$('#seek').value=Math.round(f*1000);
  const showPage=S.top==='page';
  $('#pct').textContent=showPage?pgTxt:pctTxt;
  $('#pageinfo').textContent=showPage?pctTxt:pgTxt;
  $('#bmBtn').classList.toggle('on',bookmarksInView().length>0);
  updatePager();
  $('#left').textContent=fmtTime(totalWords*(1-f)/S.wpm);
  clearTimeout(saveT);
  saveT=setTimeout(()=>lsSet(docKey,f),400);
}
let uiQueued=false;
reader.addEventListener('scroll',()=>{
  if(uiQueued)return;uiQueued=true;
  requestAnimationFrame(()=>{uiQueued=false;updateUI()});
},{passive:true});

/* ---------- auto-scroll ---------- */
function pxPerSec(){return (S.wpm/60)*(spanH/Math.max(1,totalWords))}
function frame(t){
  if(!playing)return;
  const dt=Math.min(0.1,(t-lastT)/1000);lastT=t;
  if(touching){pos=reader.scrollTop}
  else{
    if(Math.abs(reader.scrollTop-lastSet)>2)pos=reader.scrollTop;
    pos+=pxPerSec()*dt;
    const max=maxScroll();
    if(pos>=max){reader.scrollTop=max;stop();toast('End of document');return}
    reader.scrollTop=pos;lastSet=reader.scrollTop;
  }
  raf=requestAnimationFrame(frame);
}
async function lockScreen(){
  try{if('wakeLock' in navigator&&!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}}catch(e){}
}
function unlockScreen(){try{if(wakeLock){wakeLock.release();wakeLock=null}}catch(e){}}
function start(){
  if(playing||!doc.paras.length)return;
  playing=true;pos=reader.scrollTop;lastSet=pos;lastT=performance.now();
  $('#play').textContent='⏸';
  document.body.classList.add('hide');
  lockScreen();
  raf=requestAnimationFrame(frame);
}
function stop(){
  if(!playing)return;
  playing=false;cancelAnimationFrame(raf);
  $('#play').textContent='▶';
  unlockScreen();
}
function toggle(){playing?stop():start()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&playing)lockScreen()});
reader.addEventListener('touchstart',()=>{touching=true},{passive:true});
reader.addEventListener('touchend',()=>{touching=false},{passive:true});
reader.addEventListener('touchcancel',()=>{touching=false},{passive:true});

function setWpm(v){
  S.wpm=Math.max(40,Math.min(1200,Math.round(v/5)*5));
  $('#wpmlabel').textContent=S.wpm+' wpm';saveSettings();updateUI();
}
function wpmStep(dir){const step=Math.max(10,Math.round(S.wpm*0.08/5)*5);setWpm(S.wpm+dir*step)}

/* ---------- controls ---------- */
$('#play').onclick=toggle;
$('#faster').onclick=()=>wpmStep(1);
$('#slower').onclick=()=>wpmStep(-1);
const fileInput=$('#file');
const pick=()=>{fileInput.value='';fileInput.click()};
$('#menuBtn').onclick=()=>openPanel('#menu');$('#welcomeOpen').onclick=pick;
$('#sheetOpen').onclick=()=>{closeSheet();pick()};
fileInput.onchange=()=>openFile(fileInput.files[0]);

const seek=$('#seek');
seek.addEventListener('input',()=>{
  dragging=true;
  const max=maxScroll();
  reader.scrollTop=(seek.value/1000)*max;pos=reader.scrollTop;lastSet=pos;
});
seek.addEventListener('change',()=>{dragging=false;updateUI()});

reader.addEventListener('click',()=>{
  const sel=window.getSelection&&window.getSelection().toString();
  if(sel)return;
  if(sheetOpen)return;
  document.body.classList.toggle('hide');
});

/* tapping the top/bottom margin area also toggles the bars */
document.documentElement.addEventListener('click',e=>{
  if(doc.paras.length&&(e.target===document.body||e.target===document.documentElement))document.body.classList.toggle('hide');
});

/* settings sheet */
let sheetOpen=false;
function closePanels(){
  document.querySelectorAll('.sheet.on').forEach(s=>s.classList.remove('on'));
  $('#backdrop').classList.remove('on');sheetOpen=false;
}
function openPanel(sel){
  closePanels();
  $(sel).classList.add('on');$('#backdrop').classList.add('on');sheetOpen=true;
  if(sel==='#menu')showTab(menuTab);
  if(sel==='#pager')updatePager();
}
function openSheet(){openPanel('#sheet')}
function closeSheet(){closePanels()}
$('#settingsBtn').onclick=openSheet;
$('#backdrop').onclick=closePanels;

function withAnchor(fn){
  const i=curIndex(),off=reader.scrollTop-(tops[i]||0);
  fn();
  requestAnimationFrame(()=>{measure();reader.scrollTop=(tops[i]||0)+off;pos=reader.scrollTop;lastSet=pos;updateUI()});
}
function bindRange(id,key,parse){
  $(id).addEventListener('input',e=>{S[key]=parse(e.target.value);saveSettings();withAnchor(applySettings)});
}
bindRange('#r-size','size',parseInt);
bindRange('#r-lh','lh',parseFloat);
bindRange('#r-m','m',parseInt);
bindRange('#r-mt','mt',parseInt);
bindRange('#r-mb','mb',parseInt);
for(const [id,key] of [['seg-font','font'],['seg-align','align'],['seg-theme','theme'],['seg-top','top']]){
  document.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{S[key]=b.dataset.val;saveSettings();withAnchor(applySettings)});
}

/* keyboard (desktop) */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'&&e.target.type!=='range')return;
  if(e.code==='Space'){e.preventDefault();toggle()}
  else if(e.key==='+'||e.key==='=')wpmStep(1);
  else if(e.key==='-')wpmStep(-1);
});

/* re-measure on size changes (rotation, font load) */
if('ResizeObserver' in window){
  let rt;new ResizeObserver(()=>{clearTimeout(rt);rt=setTimeout(()=>{if(doc.paras.length){measure();updateUI()}},120)}).observe(text);
}

/* drag & drop */
const welcome=$('#welcome');
['dragenter','dragover'].forEach(ev=>window.addEventListener(ev,e=>{e.preventDefault();welcome.classList.add('drag')}));
['dragleave','drop'].forEach(ev=>window.addEventListener(ev,e=>{e.preventDefault();welcome.classList.remove('drag')}));
window.addEventListener('drop',e=>{const f=e.dataTransfer&&e.dataTransfer.files[0];if(f)openFile(f)});

/* ---------- library: several books kept on this device ---------- */
const LIB='reader-lib';
const libUrl=n=>new URL(n,new URL('./',location.href)).href;
const bookKey=id=>libUrl('book/'+encodeURIComponent(id));
let library=lsGet('pdfr:lib',[]);
function saveLib(){lsSet('pdfr:lib',library)}
const fmtSize=b=>b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
function mk(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
async function putBlob(url,file){
  const c=await caches.open(LIB);
  await c.put(url,new Response(file,{headers:{'Content-Type':'application/pdf','X-Filename':encodeURIComponent(file.name),'X-Size':String(file.size)}}));
}
async function takeFile(url){
  try{
    const r=await (await caches.open(LIB)).match(url);
    if(!r)return null;
    const b=await r.blob();
    return new File([b],decodeURIComponent(r.headers.get('X-Filename')||'book.pdf'),{type:'application/pdf'});
  }catch(e){return null}
}
async function libRegister(file,title,pages,storeBlob){
  const id=file.name+'|'+file.size;
  let e=library.find(b=>b.id===id);
  if(!e){e={id,name:file.name,size:file.size};library.push(e)}
  e.title=title;e.pages=pages;e.last=Date.now();
  if(storeBlob){
    try{await putBlob(bookKey(id),file);e.stored=true}
    catch(err){e.stored=false;toast('Could not keep this book offline (storage full?)')}
  }
  saveLib();renderPanels();
}
async function openBook(id){
  const f=await takeFile(bookKey(id));
  if(f)openFile(f,{skipSave:true});
  else{
    const e=library.find(b=>b.id===id);
    if(e){e.stored=false;saveLib()}
    renderPanels();toast('That book is no longer stored on this device');
  }
}
async function deleteBook(id){
  const e=library.find(b=>b.id===id);
  if(!e||!confirm('Remove "'+(e.title||e.name)+'" from this device?'))return;
  try{await (await caches.open(LIB)).delete(bookKey(id))}catch(err){}
  library=library.filter(b=>b.id!==id);saveLib();
  try{['pos','pages','bm'].forEach(k=>localStorage.removeItem('pdfr:'+k+':'+id))}catch(err){}
  renderPanels();
}
function renderLibrary(box){
  box.replaceChildren();
  const list=library.filter(b=>b.stored!==false).sort((a,b)=>(b.last||0)-(a.last||0));
  if(!list.length){box.appendChild(mk('div','empty','No saved books yet. Open a PDF and it will be kept here for next time.'));return}
  for(const b of list){
    const frac=lsGet('pdfr:pos:'+b.id,0);
    const row=mk('div','item'+(b.id===bookId?' cur':''));
    const g=mk('div','grow');
    g.append(mk('div','t',b.title||b.name),
      mk('div','m',(frac>0.002?Math.round(frac*100)+'% read':'Not started')+' · '+(b.pages?b.pages+' pp · ':'')+fmtSize(b.size)));
    const x=mk('button','x','✕');x.setAttribute('aria-label','Remove from this device');
    x.onclick=ev=>{ev.stopPropagation();deleteBook(b.id)};
    row.append(g,x);
    row.onclick=()=>{if(b.id===bookId&&doc.paras.length)closePanels();else openBook(b.id)};
    box.appendChild(row);
  }
}
async function storeInfo(){
  const d=$('#storeInfo');
  try{
    const e=await navigator.storage.estimate();
    d.textContent='Storage used by this app: '+fmtSize(e.usage||0)+(e.quota?' of '+fmtSize(e.quota)+' available':'');
  }catch(err){d.textContent=''}
}

/* ---------- contents (PDF outline, or detected headings) ---------- */
async function loadOutline(pdf){
  const out=await pdf.getOutline();
  if(!out||!out.length)return [];
  const items=[];
  async function walk(list,depth){
    for(const it of list){
      if(items.length>1500)return;
      let pageNum=null;
      try{
        let dest=it.dest;
        if(typeof dest==='string')dest=await pdf.getDestination(dest);
        if(Array.isArray(dest)&&dest[0]!=null){
          const ref=dest[0];
          pageNum=(typeof ref==='object')?(await pdf.getPageIndex(ref))+1:ref+1;
        }
      }catch(e){}
      const title=(it.title||'').replace(/\s+/g,' ').trim();
      if(pageNum&&title)items.push({title,depth,page:pageNum});
      if(it.items&&it.items.length)await walk(it.items,depth+1);
    }
  }
  await walk(out,0);
  return items;
}
function buildToc(outline){
  const norm=s=>s.toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim();
  const out=[];
  for(const o of outline){
    const nt=norm(o.title).slice(0,24);
    let idx=-1;
    for(let i=0;i<doc.paras.length;i++){
      const p=doc.paras[i];
      if(p.page<o.page)continue;
      if(p.page>o.page)break;
      if(nt&&norm(p.text).startsWith(nt)){idx=i;break}
    }
    if(idx<0)idx=doc.paras.findIndex(p=>p.page>=o.page);
    if(idx<0)continue;
    out.push({title:o.title,depth:Math.min(o.depth,3),idx});
  }
  if(out.length<2){
    out.length=0;
    doc.paras.forEach((p,i)=>{if(p.head)out.push({title:p.text,depth:0,idx:i})});
  }
  return out;
}
function pageOfPara(i){return customPages>0?pageOfWord(cum[i]):(doc.paras[i]?doc.paras[i].page:1)}
function renderContents(){
  const box=$('#pb-contents');box.replaceChildren();
  if(!doc.paras.length){box.appendChild(mk('div','empty','Open a book to see its contents.'));return}
  if(!toc.length){box.appendChild(mk('div','empty','No chapters found in this PDF. Use bookmarks or the page stepper to move around.'));return}
  const ci=curIndex();let curT=-1;
  toc.forEach((c,k)=>{if(c.idx<=ci)curT=k});
  toc.forEach((c,k)=>{
    const row=mk('div','item'+(k===curT?' cur':''));
    row.style.paddingLeft=(2+c.depth*16)+'px';
    const g=mk('div','grow');
    g.append(mk('div','t',c.title),mk('div','m','p. '+pageOfPara(c.idx)));
    row.appendChild(g);
    row.onclick=()=>{jumpToPara(c.idx);closePanels()};
    box.appendChild(row);
  });
}

/* ---------- bookmarks ---------- */
function saveMarks(){lsSet('pdfr:bm:'+bookId,bookmarks)}
function bookmarksInView(){
  if(!doc.paras.length||!bookmarks.length)return [];
  const w0=wordPos(),span=reader.clientHeight/Math.max(1,spanH)*totalWords;
  return bookmarks.filter(b=>b.w>=w0-3&&b.w<=w0+span);
}
function addBookmark(){
  if(!doc.paras.length)return;
  if(bookmarksInView().length){toast('Already bookmarked here');return}
  const w=wordPos(),i=curIndex();
  bookmarks.push({id:Date.now().toString(36),w,snip:doc.paras[i].text.slice(0,90),t:Date.now()});
  bookmarks.sort((a,b)=>a.w-b.w);
  saveMarks();toast('Bookmarked · p. '+pageOfWord(w));
  renderPanels();updateUI();
}
function removeBookmarksInView(){
  const ids=new Set(bookmarksInView().map(b=>b.id));
  bookmarks=bookmarks.filter(b=>!ids.has(b.id));
  saveMarks();toast('Bookmark removed');
  renderPanels();updateUI();
}
function toggleBookmark(){if(bookmarksInView().length)removeBookmarksInView();else addBookmark()}
function renderMarks(){
  const box=$('#pb-marks');box.replaceChildren();
  if(!doc.paras.length){box.appendChild(mk('div','empty','Open a book to add bookmarks.'));return}
  const add=mk('div','addrow'),btn=mk('button',null,'+ Bookmark this spot');
  btn.onclick=addBookmark;add.appendChild(btn);box.appendChild(add);
  if(!bookmarks.length){box.appendChild(mk('div','empty','No bookmarks yet. The bookmark icon at the top also adds or removes one.'));return}
  for(const b of bookmarks){
    const row=mk('div','item');
    const g=mk('div','grow');
    g.append(mk('div','t',b.snip),mk('div','m','p. '+pageOfWord(b.w)+' · '+Math.round(b.w/Math.max(1,totalWords)*100)+'%'));
    const x=mk('button','x','✕');x.setAttribute('aria-label','Delete bookmark');
    x.onclick=ev=>{ev.stopPropagation();bookmarks=bookmarks.filter(m=>m.id!==b.id);saveMarks();renderPanels();updateUI()};
    row.append(g,x);
    row.onclick=()=>{scrollToWord(b.w);closePanels()};
    box.appendChild(row);
  }
}
$('#bmBtn').onclick=toggleBookmark;

/* ---------- menu tabs ---------- */
menuTab=lsGet('pdfr:tab','contents');
function renderPanels(){
  if(menuTab==='contents')renderContents();
  else if(menuTab==='marks')renderMarks();
  else{renderLibrary($('#menuLib'));storeInfo()}
  renderLibrary($('#welcomeLib'));
}
function showTab(t){
  menuTab=t;lsSet('pdfr:tab',t);
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('sel',b.dataset.tab===t));
  for(const k of ['contents','marks','library'])$('#pb-'+k).hidden=(k!==t);
  renderPanels();
  if(t==='contents'){const c=$('#pb-contents .cur');if(c)c.scrollIntoView({block:'center'})}
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
$('#addPdf').onclick=()=>{closePanels();pick()};

/* ---------- top indicator swap + page stepper ---------- */
$('#pct').onclick=()=>{
  S.top=S.top==='page'?'pct':'page';saveSettings();applySettings();updateUI();
  toast('Top shows the '+(S.top==='page'?'page number':'percentage'));
};
function stepPage(d){gotoPage(pageNow()+d,d)}
function bindHold(btn,fn){
  let t1=0,t2=0;
  const halt=()=>{clearTimeout(t1);clearInterval(t2)};
  btn.addEventListener('pointerdown',e=>{e.preventDefault();halt();fn();t1=setTimeout(()=>{t2=setInterval(fn,110)},420)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,halt));
  btn.addEventListener('contextmenu',e=>e.preventDefault());
}
document.querySelectorAll('#pager .pgbtn').forEach(b=>bindHold(b,()=>stepPage(parseInt(b.dataset.d,10))));
function updatePager(){
  if(!$('#pager').classList.contains('on'))return;
  const N=pageCount(),n=pageNow();
  $('#pgNow').textContent=n+' / '+N;
  const r=$('#pgRange');r.max=N;if(!pgDrag)r.value=n;
}
$('#pgRange').addEventListener('input',e=>{pgDrag=true;gotoPage(parseInt(e.target.value,10),1)});
$('#pgRange').addEventListener('change',()=>{pgDrag=false;updatePager()});
$('#pgNow').onclick=()=>{
  const v=prompt('Go to page (1–'+pageCount()+'):');
  if(v===null)return;
  const n=parseInt(v,10);
  if(n>=1)gotoPage(n,1);
};

/* ---------- start-up: share target, import of the old single saved book ---------- */
(async()=>{
  try{
    if(!library.length&&'caches' in window){
      const f=await takeFile(libUrl('__last'));
      if(f){
        const id=f.name+'|'+f.size;
        await putBlob(bookKey(id),f);
        library.push({id,name:f.name,size:f.size,title:f.name.replace(/\.pdf$/i,''),pages:0,last:Date.now(),stored:true});
        saveLib();
        try{await (await caches.open(LIB)).delete(libUrl('__last'))}catch(e){}
      }
    }
  }catch(e){}
  renderPanels();
  if(new URLSearchParams(location.search).has('shared')){
    try{history.replaceState(null,'',location.pathname)}catch(e){}
    const f=await takeFile(libUrl('__shared'));
    if(f)openFile(f);
  }
})();

let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;$('#installBtn').hidden=false});
$('#installBtn').onclick=async()=>{
  if(!deferredInstall)return;
  deferredInstall.prompt();
  try{await deferredInstall.userChoice}catch(e){}
  deferredInstall=null;$('#installBtn').hidden=true;
};
window.addEventListener('appinstalled',()=>{$('#installBtn').hidden=true;toast('Installed')});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});

applySettings();
})();
</script>
